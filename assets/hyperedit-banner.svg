<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">HyperEdit</title>
  <desc id="desc">Instruction-guided editing with request-specific hypernetworks. Code, LaTeX, SQL, and Wikipedia text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d32"/><stop offset="1" stop-color="#18253f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b4c6e6" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>
  <rect x="52" y="45" width="38" height="4" rx="2" fill="#5eead4"/>
  <text x="104" y="52" fill="#9fb3d0" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">INSTRUCTION-BASED TEXT EDITING</text>
  <text x="50" y="145" fill="#f1f5ff" font-family="Arial, sans-serif" font-weight="700" font-size="76" letter-spacing="-3">Hyper<tspan fill="#5eead4">Edit</tspan></text>
  <text x="54" y="192" fill="#c0cde2" font-family="Arial, sans-serif" font-size="22">Adapt to the request. Preserve the context.</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#c4d3e8" text-anchor="middle">
    <rect x="54" y="242" width="74" height="30" rx="15" fill="#25344e"/><text x="91" y="262">Code</text>
    <rect x="140" y="242" width="82" height="30" rx="15" fill="#25344e"/><text x="181" y="262">LaTeX</text>
    <rect x="234" y="242" width="66" height="30" rx="15" fill="#25344e"/><text x="267" y="262">SQL</text>
    <rect x="312" y="242" width="108" height="30" rx="15" fill="#25344e"/><text x="366" y="262">Wikipedia</text>
  </g>
  <rect x="756" y="52" width="466" height="236" rx="16" fill="#0c172a" stroke="#344560"/>
  <circle cx="779" cy="74" r="4" fill="#53647c"/><circle cx="794" cy="74" r="4" fill="#53647c"/><circle cx="809" cy="74" r="4" fill="#53647c"/>
  <text x="1197" y="78" fill="#8198b8" font-family="monospace" font-size="11" text-anchor="end">request-conditioned adaptation</text>
  <path d="M756 94H1222" stroke="#26364e"/>
  <g font-family="monospace" font-size="15">
    <text x="780" y="130" fill="#8198b8">// update the greeting</text>
    <rect x="773" y="149" width="429" height="34" rx="6" fill="#3a2535"/>
    <text x="787" y="171" fill="#fda4af">− print("Hello, world!")</text>
    <rect x="773" y="192" width="429" height="34" rx="6" fill="#153c3c"/>
    <text x="787" y="214" fill="#5eead4">+ print("Hello, HyperEdit!")</text>
    <text x="780" y="259" fill="#93a8c7">same context · targeted changes</text>
  </g>
  <rect x="54" y="310" width="1168" height="2" rx="1" fill="url(#accent)" opacity=".65"/>
</svg>
