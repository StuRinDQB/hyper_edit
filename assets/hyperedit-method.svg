<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">HyperEdit — from an editing request to a dynamic adapter</title>
  <desc id="desc">The original text and edit instruction feed both a frozen sentence encoder and the frozen language model. The hypernetwork combines GRU features and learned local embeddings to generate matrix A. A and a learned, input-independent matrix B form a low-rank update for the language model. Training combines generation loss and difference-aware loss.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="none" stroke="#718096" stroke-width="1.8"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#0d9488" stroke-width="2"/></marker>
    <pattern id="matrix" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="10" height="10" rx="2" fill="#14b8a6" opacity=".8"/></pattern>
    <pattern id="staticMatrix" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="10" height="10" rx="2" fill="#8b7ad5" opacity=".7"/></pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .heading { font-size: 20px; font-weight: 700; fill: #15243c; }
      .body { font-size: 17px; fill: #42536b; }
      .small { font-size: 13px; fill: #64748b; }
      .wire { fill: none; stroke: #94a3b8; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
      .dynamic { fill: none; stroke: #0d9488; stroke-width: 2.3; stroke-linejoin: round; marker-end: url(#greenArrow); }
    </style>
  </defs>
  <rect width="1440" height="760" rx="24" fill="#f8fafc"/>
  <rect x="1" y="1" width="1438" height="758" rx="23" fill="none" stroke="#e2e8f0"/>
  <rect x="40" y="40" width="4" height="47" rx="2" fill="#14b8a6"/>
  <text x="58" y="62" font-size="28" font-weight="700" fill="#15243c">An adapter for every edit.</text>
  <text x="58" y="88" class="body">HyperEdit turns the instruction and its context into dynamic low-rank weights.</text>
  <g transform="translate(1010 49)">
    <circle cx="0" cy="0" r="5" fill="#58a6c4"/><text x="12" y="5" class="small">Frozen</text>
    <circle cx="106" cy="0" r="5" fill="#8b7ad5"/><text x="118" y="5" class="small">Trainable</text>
    <circle cx="231" cy="0" r="5" fill="#14b8a6"/><text x="243" y="5" class="small">Generated per request</text>
  </g>

  <!-- The original prompt also enters the language model directly. -->
  <path d="M300 260H325V138H1245V250" class="wire"/>
  <rect x="909" y="124" width="199" height="25" rx="12" fill="#f8fafc"/>
  <text x="1008" y="141" text-anchor="middle" class="small">Original text + instruction</text>

  <text x="40" y="185" class="section">01 / EDITING CONTEXT</text>
  <rect x="40" y="210" width="260" height="302" rx="16" fill="#fff" stroke="#dce4ef"/>
  <rect x="56" y="228" width="101" height="24" rx="7" fill="#e4f5f1"/>
  <text x="67" y="244" font-size="11" font-weight="700" fill="#087e72" letter-spacing="1">INSTRUCTION</text>
  <text x="60" y="284" class="body">Replace “Responsible AI”</text>
  <text x="60" y="311" class="body">with “Large Language Models”.</text>
  <path d="M60 336H280" stroke="#e8edf4"/>
  <text x="60" y="366" class="small" letter-spacing="1">ORIGINAL TEXT</text>
  <text x="60" y="402" class="body">The topic of</text>
  <rect x="55" y="414" width="135" height="26" rx="5" fill="#fef0e9"/>
  <text x="60" y="433" font-size="17" fill="#ad643f">Responsible AI</text>
  <text x="60" y="461" class="body">has gained much attention.</text>
  <path d="M300 360H350" class="wire"/>

  <text x="350" y="235" class="section">02 / ENCODE</text>
  <rect x="350" y="275" width="200" height="170" rx="16" fill="#edf6fb" stroke="#b7d8e8"/>
  <rect x="368" y="294" width="65" height="22" rx="6" fill="#d9edf7"/>
  <text x="379" y="309" font-size="10" font-weight="700" fill="#38758e" letter-spacing="1">FROZEN</text>
  <text x="450" y="349" class="heading" text-anchor="middle">Sentence</text>
  <text x="450" y="376" class="heading" text-anchor="middle">encoder</text>
  <text x="450" y="415" class="small" text-anchor="middle">Context embedding c</text>

  <text x="600" y="185" class="section">03 / GENERATE THE ADAPTER</text>
  <rect x="600" y="210" width="440" height="424" rx="18" fill="#fff" stroke="#d9d5ee"/>
  <rect x="620" y="245" width="155" height="68" rx="12" fill="#f2effb" stroke="#d9d0f0"/>
  <text x="697" y="276" class="heading" text-anchor="middle">GRU</text>
  <text x="697" y="297" class="small" text-anchor="middle">Context features hˡ</text>
  <rect x="850" y="245" width="170" height="68" rx="12" fill="#f2effb" stroke="#d9d0f0"/>
  <text x="935" y="274" font-size="17" font-weight="700" fill="#15243c" text-anchor="middle">Local embeddings</text>
  <text x="935" y="298" class="small" text-anchor="middle">Learned codes Eˡ</text>
  <path d="M697 313V331H770V348" class="wire"/>
  <path d="M935 313V331H870V348" class="wire"/>
  <rect x="650" y="348" width="340" height="60" rx="12" fill="#f2effb" stroke="#d9d0f0"/>
  <text x="820" y="374" font-size="16" font-weight="700" fill="#594c8d" text-anchor="middle">Fuse context + local embeddings</text>
  <text x="820" y="395" class="small" text-anchor="middle">LayerNorm → GELU → MLP</text>
  <path d="M745 408V442" class="dynamic"/>
  <rect x="628" y="442" width="170" height="78" rx="12" fill="#ecfaf5" stroke="#9fdfcb"/>
  <text x="644" y="468" font-size="18" font-weight="700" fill="#0a7e70">Aˡ</text>
  <text x="644" y="495" class="small">Dynamic</text>
  <rect x="728" y="455" width="56" height="56" fill="url(#matrix)"/>
  <rect x="850" y="442" width="170" height="78" rx="12" fill="#f2effb" stroke="#d9d0f0"/>
  <text x="866" y="468" font-size="18" font-weight="700" fill="#66549d">Bˡ</text>
  <text x="866" y="495" class="small">Static</text>
  <rect x="950" y="463" width="56" height="42" fill="url(#staticMatrix)"/>
  <text x="824" y="489" font-size="23" fill="#8b98ac" text-anchor="middle">×</text>
  <path d="M713 520V536H775V552" class="dynamic"/>
  <path d="M935 520V536H870V552" class="wire"/>
  <rect x="650" y="552" width="340" height="58" rx="12" fill="#e2f6ef" stroke="#96d4c2"/>
  <text x="820" y="578" font-size="20" font-weight="700" fill="#087e72" text-anchor="middle">ΔWˡ = (α / r) Aˡ Bˡ</text>
  <text x="820" y="598" class="small" text-anchor="middle">Low-rank update for layer l</text>
  <path d="M990 581H1064V352H1090" class="dynamic"/>

  <text x="1090" y="185" class="section">04 / APPLY THE EDIT</text>
  <rect x="1090" y="250" width="310" height="170" rx="16" fill="#edf6fb" stroke="#b7d8e8"/>
  <text x="1110" y="282" class="heading">Language model</text>
  <rect x="1309" y="264" width="73" height="23" rx="6" fill="#d9edf7"/>
  <text x="1320" y="280" font-size="10" font-weight="700" fill="#38758e" letter-spacing="1">FROZEN</text>
  <rect x="1110" y="306" width="270" height="26" rx="6" fill="#deedf5"/>
  <text x="1245" y="324" class="small" text-anchor="middle">Decoder layers</text>
  <rect x="1110" y="342" width="270" height="43" rx="8" fill="#fff" stroke="#84c9b7"/>
  <text x="1245" y="370" font-size="22" fill="#15243c" text-anchor="middle">Wˡ <tspan fill="#0d9488">+ ΔWˡ</tspan></text>
  <text x="1245" y="405" class="small" text-anchor="middle">Base weights stay unchanged</text>
  <path d="M1245 420V465" class="dynamic"/>
  <rect x="1090" y="465" width="310" height="169" rx="16" fill="#fff" stroke="#a8d7c8"/>
  <text x="1110" y="494" font-size="11" font-weight="700" fill="#087e72" letter-spacing="1">EDITED TEXT</text>
  <text x="1110" y="525" class="body">The topic of</text>
  <rect x="1105" y="537" width="202" height="26" rx="5" fill="#dff5ec"/>
  <text x="1110" y="556" font-size="17" fill="#087e72">Large Language Models</text>
  <text x="1110" y="586" class="body">has gained much attention.</text>
  <text x="1110" y="614" font-size="12" fill="#8b9aac">Only the requested phrase changes.</text>

  <path d="M550 360H579V279H620" class="wire"/>

  <path d="M40 670H1400" stroke="#e1e7ef"/>
  <text x="40" y="706" class="section">TRAINING OBJECTIVE</text>
  <text x="259" y="707" font-size="18" fill="#42536b">Generation loss <tspan fill="#0d9488">+ difference-aware loss</tspan></text>
  <text x="1400" y="707" text-anchor="end" class="small">Learn the edit. Preserve the surrounding text.</text>
</svg>
